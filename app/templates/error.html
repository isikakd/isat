{% extends "base.html" %}

{% block title %}{{ code }} - ISAT{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 70vh;">
    <i class="bi bi-exclamation-triangle text-accent" style="font-size: 3rem;"></i>
    <h2 class="mt-3">{{ code }} — {{ title }}</h2>
    <p class="isat-footer-note">{{ message }}</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-isat-primary mt-3">
        <i class="bi bi-house"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
